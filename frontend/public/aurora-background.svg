<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050712"/>
      <stop offset="0.45" stop-color="#080b18"/>
      <stop offset="1" stop-color="#05050d"/>
    </linearGradient>
    <radialGradient id="violet-glow" cx="24%" cy="7%" r="54%">
      <stop offset="0" stop-color="#8d7cff" stop-opacity="0.34"/>
      <stop offset="0.38" stop-color="#6c5ce7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal-glow" cx="83%" cy="15%" r="52%">
      <stop offset="0" stop-color="#55efc4" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#00cec9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00cec9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose-glow" cx="62%" cy="1%" r="42%">
      <stop offset="0" stop-color="#fd79a8" stop-opacity="0.16"/>
      <stop offset="0.46" stop-color="#fd79a8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fd79a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="wide-blur" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <linearGradient id="aurora-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c5ce7" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#a29bfe" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#55efc4" stop-opacity="0.42"/>
      <stop offset="0.75" stop-color="#74b9ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#00cec9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00cec9" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#55efc4" stop-opacity="0.24"/>
      <stop offset="0.56" stop-color="#6c5ce7" stop-opacity="0.26"/>
      <stop offset="0.86" stop-color="#fd79a8" stop-opacity="0.12"/>
