  <rect width="2400" height="1400" fill="url(#sky)"/>
  <rect width="2400" height="1400" fill="url(#violet-glow)"/>
  <rect width="2400" height="1400" fill="url(#teal-glow)"/>
  <rect width="2400" height="1400" fill="url(#rose-glow)"/>

  <g filter="url(#wide-blur)" opacity="0.95">
    <path d="M-120 285 C 250 180, 520 350, 830 248 S 1390 130, 1745 255 S 2200 330, 2520 170 L2520 365 C2145 465, 1860 365, 1540 310 S 980 380, 665 330 S 160 340, -120 430 Z" fill="url(#aurora-a)"/>
    <path d="M-140 135 C 250 90, 480 210, 835 160 S 1375 35, 1770 150 S 2180 250, 2540 85 L2540 260 C2210 365, 1885 238, 1565 220 S 1030 290, 700 245 S 250 210, -140 320 Z" fill="url(#aurora-b)"/>
  </g>

  <g filter="url(#soft-blur)" opacity="0.7">
    <path d="M260 400 C 560 250, 785 435, 1085 315 S 1635 230, 2030 390" fill="none" stroke="#55efc4" stroke-width="74" stroke-linecap="round" opacity="0.16"/>
    <path d="M-40 510 C 330 355, 595 485, 935 405 S 1510 285, 1880 430 S 2260 540, 2460 410" fill="none" stroke="#a29bfe" stroke-width="92" stroke-linecap="round" opacity="0.14"/>
    <path d="M440 210 C 750 120, 1010 225, 1310 165 S 1810 125, 2080 230" fill="none" stroke="#74b9ff" stroke-width="54" stroke-linecap="round" opacity="0.11"/>
  </g>

  <rect width="2400" height="1400" fill="#05060d" opacity="0.34"/>
