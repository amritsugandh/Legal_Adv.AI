services:
  # 1. Backend Web Service (Python FastAPI)
  - type: web
    name: legallens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GOOGLE_API_KEY
                sync: false

  # 2. Frontend Static Site (React Vite)
      - type: static
        name: legallens-web
        rootDir: frontend
        buildCommand: npm install && npm run build
        routes:
          - type: rewrite
            source: /*
                          
        destination: /index.html
