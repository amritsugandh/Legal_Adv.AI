# Render Blueprint configuration for LegalLens
# Deploy with: https://dashboard.render.com/select-repo
#
# IMPORTANT: After first deploy, add a Persistent Disk to the service
# and mount it at /app/data to prevent SQLite/uploads being wiped on restart.
#
# Required secret env vars (set in Render dashboard, not here):
#   GOOGLE_API_KEY  — from https://aistudio.google.com/app/apikey
#   CORS_ORIGINS    — e.g. ["https://your-app.vercel.app"]

services:
  - type: web
    name: legallens-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

      - key: DEBUG
        value: "false"

      - key: APP_NAME
        value: "LegalLens"

      - key: LLM_MODEL
        value: "gemini-2.0-flash"

      - key: EMBEDDING_MODEL
        value: "models/text-embedding-004"

      - key: UPLOAD_DIR
        value: "/opt/render/project/src/backend/uploads"

      - key: CHROMA_PERSIST_DIR
        value: "/opt/render/project/src/backend/chroma_db"

      - key: DATABASE_URL
        value: "sqlite+aiosqlite:////opt/render/project/src/backend/legal_lens.db"

      - key: CORS_ORIGINS
        sync: false

      - key: GOOGLE_API_KEY
        sync: false
